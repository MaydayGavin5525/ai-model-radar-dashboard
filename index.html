  .score-card .rec { font-size: 13px; color: #444; }
  .score-card .src { font-size: 11px; color: #999; margin-top: 8px; }

  .trend-item { background: #fff; border: 1px solid var(--line); padding: 16px; }

  .trend-item .meta { font-size: 12px; color: #666; margin-bottom: 6px; }
